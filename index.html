<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>80% Domestic</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="80% Domestic">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #16181d; --muted: #6b7280; --line: #e3e5ea; --chip: #eef1f6;
  --accent: #0f766e; --ok: #15803d; --danger: #b91c1c;
  --watch-bg: #fde68a; --watch-ink: #713f12; --alert-bg: #fecaca; --alert-ink: #7f1d1d; --over: #dc2626;
  --lap: #2563eb; --pull: #6d28d9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --card: #181b21; --ink: #eceef2; --muted: #9aa1ad; --line: #2a2e36; --chip: #232731;
    --accent: #2dd4bf; --ok: #4ade80; --danger: #f87171;
    --watch-bg: #4a3b0a; --watch-ink: #fde68a; --alert-bg: #4c1414; --alert-ink: #fecaca; --over: #ef4444;
    --lap: #3b82f6; --pull: #a78bfa;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font: inherit; color: inherit; }
.hidden { display: none !important; }
header.bar { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line);
  padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
header.bar h1 { font-size: 20px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ver { font-size: 13px; font-weight: 800; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; min-height: 44px; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 6px 10px; font-size: 14px; min-height: 36px; }
main { padding: 16px; max-width: 1100px; margin: 0 auto; }
.empty { text-align: center; color: var(--muted); padding: 50px 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; }
.card .t { font-size: 20px; font-weight: 700; }
.card .m { color: var(--muted); font-size: 14px; margin-top: 4px; }
.footer-note { color: var(--muted); font-size: 13px; text-align: center; margin: 22px 16px; }

/* Race screen */
.top { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; position: sticky; top: 0; z-index: 9; }
.row { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
.clock { flex: 1; min-width: 220px; border-radius: 14px; padding: 6px 14px; background: var(--chip); }
.clock .t { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.clock .s { font-size: 13px; color: var(--muted); }
.clock.watch { background: var(--watch-bg); } .clock.watch .t, .clock.watch .s { color: var(--watch-ink); }
.clock.alert { background: var(--alert-bg); } .clock.alert .t, .clock.alert .s { color: var(--alert-ink); }
.clock.over { background: var(--over); } .clock.over .t, .clock.over .s { color: #fff; }
.startbox { border-radius: 14px; padding: 6px 14px; background: var(--chip); min-width: 170px; }
.startbox .t { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.startbox .s { font-size: 12px; color: var(--muted); }
.cutline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 14px; }
.cutline .cut { font-size: 20px; font-weight: 800; }
.cutline .why { color: var(--muted); font-size: 13px; }
.key { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.key.watch { background: var(--watch-bg); color: var(--watch-ink); } .key.alert { background: var(--alert-bg); color: var(--alert-ink); } .key.over { background: var(--over); color: #fff; }
.status { margin-top: 6px; font-size: 14px; color: var(--muted); } .status b { color: var(--ink); }

.work { display: grid; grid-template-columns: 1fr 300px; gap: 14px; padding: 14px 16px; max-width: 1200px; margin: 0 auto; }
@media (max-width: 820px) {
  .work { grid-template-columns: 1fr; } .pad { order: -1; position: static; display: grid; grid-template-columns: 1fr 1.6fr; gap: 0 10px; align-items: start; }
  .pad > * { grid-column: 1; } .pad > .keys { grid-column: 2; grid-row: 1 / span 6; }
  .disp { font-size: 28px; } .keys { margin-top: 0; grid-row: span 2; } .keys button { min-height: 48px; font-size: 22px; }
  #undoBtn { margin-top: 0 !important; } .recent { display: none; }
}
.sec { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 4px 0 8px; display: flex; gap: 10px; align-items: center; }
.sec.div { background: var(--ink); color: var(--card); padding: 6px 10px; border-radius: 8px; margin-top: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.tile { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 8px 6px; min-height: 76px; cursor: pointer; text-align: center; user-select: none; -webkit-user-select: none; }
.tile .b { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .n { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .g { font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.watch { background: var(--watch-bg); color: var(--watch-ink); border-color: var(--watch-bg); }
.tile.alert { background: var(--alert-bg); color: var(--alert-ink); border-color: var(--over); }
.tile.lapped { border-color: var(--lap); box-shadow: inset 0 0 0 3px var(--lap); }
.tile.done { opacity: .55; min-height: 58px; }
.tile.done .b { font-size: 20px; }
.tile .tag { display: inline-block; font-size: 10px; font-weight: 900; padding: 1px 5px; border-radius: 5px; color: #fff; background: var(--lap); }
.tile .tag.p { background: var(--pull); } .tile .tag.o { background: var(--over); } .tile .tag.w { background: var(--accent); }
.tile.watchme { border-style: dashed; border-color: var(--accent); border-width: 3px; }
.tiles.big { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.tiles.big .tile { min-height: 92px; } .tiles.big .tile .b { font-size: 36px; }
.tiles.small { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.tiles.small .tile { min-height: 54px; padding: 4px; } .tiles.small .tile .b { font-size: 20px; } .tiles.small .tile .n { font-size: 11px; }
.tile.hit { background: var(--ok) !important; color: #fff !important; border-color: var(--ok) !important; opacity: 1; }
.tile.hit .g, .tile.hit .n { color: #fff; }
.sec.up { color: var(--accent); }
.sugg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.sugg:empty { display: none; }
.sugg button { min-height: 56px; border-radius: 10px; border: 2px solid var(--accent); background: var(--card); cursor: pointer; padding: 2px; overflow: hidden; }
.sugg button b { display: block; font-size: 24px; line-height: 1.1; }
.sugg button span { display: block; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.bunchbox { margin-top: 10px; display: flex; gap: 8px; }
.bunchbox .btn { flex: 1; min-height: 52px; font-weight: 800; }
.bunchbox .btn.on { background: #ea580c; border-color: #ea580c; color: #fff; }
.bunchfill { margin-top: 10px; background: #ea580c; color: #fff; border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.bunchfill small { font-size: 13px; opacity: .9; }
.bunchrow { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 13px; }
.bunchrow span { flex: 1; }
#fillBanner { position: sticky; top: var(--padtop, 240px); z-index: 5; }
.fillbanner { background: #ea580c; color: #fff; border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.fillbanner .btn { margin-left: auto; color: #ea580c; }
.bunchinfo { font-size: 13px; font-weight: 700; color: #ea580c; margin-top: 4px; text-align: center; }
.lapcol div.est { font-style: italic; opacity: .8; }
.sus { background: var(--card); border: 2px dashed var(--accent); border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; font-size: 14px; }
.sus div { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 4px 0; flex-wrap: wrap; }
.sec .btn { margin-left: auto; text-transform: none; letter-spacing: 0; }

.pad { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; align-self: start; position: sticky; top: var(--padtop, 240px); }
.disp { font-size: 34px; font-weight: 900; text-align: center; min-height: 52px; border-radius: 10px; background: var(--chip); font-variant-numeric: tabular-nums; padding: 4px; }
.disp .who { display: block; font-size: 13px; font-weight: 600; color: var(--muted); min-height: 17px; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.keys button { min-height: 60px; font-size: 26px; font-weight: 800; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
.keys .enter { background: var(--accent); color: #fff; border-color: var(--accent); font-size: 18px; }
.recent { margin-top: 10px; font-size: 14px; }
.recent div { padding: 4px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }

.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 16px; }
.tabs button { border: 0; background: var(--card); padding: 10px 14px; font-weight: 600; cursor: pointer; }
.tabs button.on { background: var(--accent); color: #fff; }
.laps { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
.lapcol { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 14px; }
.lapcol h3 { margin: 0 0 6px; font-size: 15px; }
.lapcol div { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.lapcol div span:nth-child(2) { flex: 1; font-weight: 700; }
.lapcol div.watch { background: var(--watch-bg); color: var(--watch-ink); } .lapcol div.alert { background: var(--alert-bg); color: var(--alert-ink); }
table.list { width: 100%; border-collapse: collapse; background: var(--card); margin-top: 10px; font-size: 15px; }
table.list th { text-align: left; font-size: 12px; text-transform: uppercase; color: var(--muted); padding: 6px; border-bottom: 2px solid var(--line); }
table.list td { padding: 6px; border-bottom: 1px solid var(--line); }
table.list td.num { text-align: right; font-variant-numeric: tabular-nums; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal .sheet { background: var(--card); border-radius: 16px; padding: 18px; width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; }
.modal h2 { margin: 0 0 10px; }
.modal label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 12px 0 4px; }
.modal input[type=text], .modal textarea { width: 100%; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.modal textarea { min-height: 90px; }
.modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.catbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: #16181d; color: #fff; padding: 12px 16px; border-radius: 12px; display: flex; gap: 14px; align-items: center;
  box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 70; max-width: calc(100% - 32px); font-size: 15px; }
.toast button { background: none; border: 0; color: #5eead4; font-weight: 800; cursor: pointer; padding: 4px; }
.toast.bad { background: var(--over); } .toast.bad button { color: #fff; text-decoration: underline; }
</style>
</head>
<body>

<header class="bar">
  <button id="backBtn" class="btn small hidden">‹ Races</button>
  <h1 id="title">80% Domestic</h1>
  <span id="verTag" class="ver"></span>
  <button id="newBtn" class="btn primary">New race</button>
</header>

<!-- Home -->
<main id="home">
  <div id="emptyState" class="empty">
    <h2>No races yet</h2>
    <p>Tap <b>New race</b>, then import a start list (Excel, CSV or PDF) or type the bib numbers.</p>
    <p>No live timing needed: tap each rider as they pass the 80% zone. Everything is stored on this iPad.</p>
  </div>
  <div id="raceList" class="cards"></div>
  <p class="footer-note" id="appVersion"></p>
</main>

<!-- Race -->
<section id="raceView" class="hidden">
  <div class="top">
    <div class="row">
      <div class="startbox" id="startBox"></div>
      <div class="clock" id="clock"><div class="t" id="clockT">–</div><div class="s" id="clockS"></div></div>
    </div>
    <div class="cutline" id="cutLine"></div>
    <div class="status" id="status"></div>
  </div>
  <div class="work">
    <div>
      <div id="fillBanner"></div>
      <div id="sus"></div>
      <div class="sec up" id="upHead">Up next</div>
      <div class="tiles big" id="upTiles"></div>
      <div class="sec" id="toComeHead">Still to come</div>
      <div class="tiles small" id="toCome"></div>
      <div class="sec div" id="throughHead">Through this lap</div>
      <div class="tiles small" id="through"></div>
      <div class="tabs" id="tabs"><button data-t="order" class="on">Passing order</button><button data-t="pulled">Pulled</button><button data-t="riders">Riders</button><button data-t="more">More…</button></div>
      <div id="tabBody"></div>
    </div>
    <div class="pad">
      <div class="disp" id="disp">&nbsp;<span class="who" id="dispWho"></span></div>
      <div class="sugg" id="sugg"></div>
      <div class="keys" id="keys">
        <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button><button data-k="del">⌫</button><button>0</button><button data-k="ok" class="enter">Pass</button>
      </div>
      <div id="bunchBox"></div>
      <button class="btn" id="undoBtn" style="width:100%;margin-top:10px">Undo last</button>
      <div class="recent" id="recent"></div>
    </div>
  </div>
</section>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"><span id="toastMsg"></span><button id="toastBtn2"></button><button id="toastBtn"></button></div>
<input id="fileInput" type="file" accept=".csv,.txt,.xlsx,.xls,.pdf,text/csv,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" class="hidden">

<script src="vendor/pdf.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script>
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
const APP_VERSION = 4;
const $ = s => document.querySelector(s);
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------- Storage ---------- */
const STORE_KEY = 'eightydomestic.v1';
let races = (() => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } })();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(races)); } catch (e) { alert('Could not save on this device: ' + e.message); } }

/* ---------- Time helpers ---------- */
function fmtDur(ms) {
  if (ms == null || isNaN(ms)) return '';
  if (ms < 0) return '-' + fmtDur(-ms);
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}
function fmtGap(g) { return g > 0 ? '+' + fmtDur(g) : 'Leader'; }
function fmtClock(t) { return new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }); }
function parseDur(s) {
  const t = String(s).trim(), m = t.match(/^(?:(\d+):)?(\d{1,2}):(\d{2})$/);
  if (m) return ((+m[1] || 0) * 3600 + (+m[2]) * 60 + (+m[3])) * 1000;
  return /^\d+$/.test(t) ? +t * 1000 : null;
}

/* ---------- Start list import: Excel, CSV, PDF ---------- */
const RE = {
  bib: /^(bib|bib\s*#|bib\s*no\.?|bib\s*number|plate|plate\s*#|number|no\.?|nr\.?|#|race\s*(no|number|#)\.?)$/i,
  first: /^(first|first\s*name|given|given\s*name|firstname)$/i,
  last: /^(last|last\s*name|surname|family\s*name|lastname)$/i,
  name: /^(name|full\s*name|rider|rider\s*name|athlete|racer|participant)$/i,
  team: /^(team|club|team\s*name|club\s*name|sponsor)$/i,
  cat: /^(cat|category|class|division|race|wave|field|age\s*group|race\s*category)$/i,
};
function isBib(v) { return /^\d{1,5}$/.test(String(v).trim()); }
// Rows (arrays of cell text) -> riders. Uses a header row when there is one, otherwise guesses the columns.
function rowsToRiders(rows) {
  rows = rows.map(r => r.map(c => String(c ?? '').trim())).filter(r => r.some(Boolean));
  let hi = -1, col = {};
  for (let i = 0; i < Math.min(rows.length, 15) && hi < 0; i++) {
    const c = {};
    rows[i].forEach((v, j) => { for (const k of Object.keys(RE)) if (c[k] == null && RE[k].test(v)) { c[k] = j; break; } });
    if (c.bib != null && (c.name != null || c.last != null || c.first != null)) { hi = i; col = c; }
  }
  const body = hi >= 0 ? rows.slice(hi + 1) : rows;
  if (hi < 0) {
    // No header: the bib column is the first one that is mostly whole numbers; the name is the next text column.
    const n = Math.max(...body.map(r => r.length));
    for (let j = 0; j < n && col.bib == null; j++) if (body.filter(r => isBib(r[j] || '')).length >= body.length * 0.6) col.bib = j;
    if (col.bib == null) return [];
    for (let j = 0; j < n && col.name == null; j++) if (j !== col.bib && body.filter(r => /[a-z]{2}/i.test(r[j] || '')).length >= body.length * 0.6) col.name = j;
  }
  const seen = new Set(), out = [];
  for (const r of body) {
    const bib = (r[col.bib] || '').replace(/^0+(?=\d)/, '');
    if (!isBib(bib) || seen.has(bib)) continue;
    seen.add(bib);
    const name = col.name != null ? r[col.name] : [r[col.first], r[col.last]].filter(Boolean).join(' ');
    out.push({ bib, name: name || '', team: col.team != null ? r[col.team] || '' : '', cat: col.cat != null ? r[col.cat] || '' : '' });
  }
  return out;
}
function parseCsv(text) {
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const sep = [',', ';', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function collapseRepeat(s) { const m = s.match(/^(.{3,}?)\1+$/); return m && /[A-Za-z]/.test(m[1]) ? m[1].trim() : s; }
// PDF: group text into lines; find the bib column from a header (Bib / Nr / No / Plate) when there is one.
async function pdfToRiders(buf) {
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p), vp = page.getViewport({ scale: 1 }), tc = await page.getTextContent(), seen = new Set(), items = [];
    for (const it of tc.items) {
      const str = collapseRepeat((it.str || '').replace(/\s+/g, ' ').trim()); if (!str) continue;
      const t = pdfjsLib.Util.transform(vp.transform, it.transform), key = str + '|' + Math.round(t[4]) + '|' + Math.round(t[5]);
      if (seen.has(key)) continue; seen.add(key); items.push({ str, x: t[4], y: t[5] });
